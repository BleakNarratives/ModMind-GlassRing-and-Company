
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equinex-Modmind | Universal Auth Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #10b981;
            --carbon: #020617;
            --glass: rgba(15, 23, 42, 0.6);
        }
        body {
            font-family: 'Space+Grotesk', sans-serif;
            background-color: var(--carbon);
            color: #f8fafc;
            /* Changed overflow:hidden to allow scrolling for long tactical logs and reports */
            overflow-x: hidden;
            overflow-y: auto;
            background-attachment: fixed;
            /* Subtle grid and bottom-up accent lighting */
            background-image: 
                radial-gradient(circle at 50% 120%, rgba(16, 185, 129, 0.1) 0%, transparent 60%),
                linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px);
            background-size: 100% 100%, 60px 60px, 60px 60px;
        }

        /* Minimalist Etched Glass */
        .etched-glass {
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-bottom: 2px solid rgba(16, 185, 129, 0.1); /* Under-glow edge */
            box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .etched-glass:hover {
            border-color: rgba(16, 185, 129, 0.2);
            box-shadow: 0 30px 60px -20px rgba(16, 185, 129, 0.1);
            transform: translateY(-2px);
        }

        /* The New Forge Ring - Precision Optics */
        .optical-ring {
            position: relative;
            border-radius: 50%;
            background: radial-gradient(circle at center, transparent 40%, rgba(16, 185, 129, 0.05) 100%);
            box-shadow: inset 0 0 40px rgba(16, 185, 129, 0.1);
        }
        .optical-ring::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            border: 1px solid rgba(16, 185, 129, 0.2);
            mask-image: linear-gradient(0deg, black, transparent);
            animation: rotate-slow 10s linear infinite;
        }

        @keyframes rotate-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Neural Scan Transition */
        .shutter-overlay {
            position: fixed;
            inset: 0;
            background: var(--carbon);
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .shutter-overlay::after {
            content: '';
            position: absolute;
            height: 2px;
            width: 100%;
            background: var(--neon-green);
            box-shadow: 0 0 20px var(--neon-green);
            transform: translateY(-100vh);
        }
        .shutter-active { opacity: 1; }
        .shutter-active::after { animation: scan-wipe 0.6s ease-in-out; }

        @keyframes scan-wipe {
            0% { transform: translateY(-100vh); }
            100% { transform: translateY(100vh); }
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(16, 185, 129, 0.5); }
    </style>
<script type="importmap">
{

</body>
